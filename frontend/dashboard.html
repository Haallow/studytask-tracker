<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudyTask Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container dashboard-container">
        <div class="header">
            <div>
                <h1>StudyTask Tracker</h1>
                <div class="user-info">Welcome, <span id="username">...</span></div>
            </div>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </div>
        
        <div id="error-message" class="error-message" style="display: none;"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>
        
        <h2>Add Task</h2>
        <form id="task-form" class="task-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="due-date">Due Date</label>
                    <input type="date" id="due-date" name="due-date">
                </div>
                
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" id="add-task-btn">Add Task</button>
        </form>
        
        <h2>My Tasks</h2>
        <div id="tasks-container">
            <div class="no-tasks">Loading tasks...</div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script>
        let currentUser = null;
        let editingTaskId = null;
        
        // Check authentication on page load
        async function checkAuth() {
            try {
                const data = await getCurrentUser();
                currentUser = data.user;
                document.getElementById('username').textContent = currentUser.username;
                loadTasks();
            } catch (error) {
                window.location.href = 'login.html';
            }
        }
        
        // Load all tasks
        async function loadTasks() {
            try {
                const data = await getTasks();
                renderTasks(data.tasks);
            } catch (error) {
                showError('Failed to load tasks: ' + error.message);
            }
        }
        
        // Render tasks to the page
        function renderTasks(tasks) {
            const container = document.getElementById('tasks-container');
            
            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<div class="no-tasks">No tasks yet. Add your first task above!</div>';
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}" data-task-id="${task._id}">
                    <div class="task-header">
                        <div>
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            <div class="task-meta">
                                <span><strong>${escapeHtml(task.subject)}</strong></span>
                                <span class="priority-badge priority-${task.priority.toLowerCase()}">${task.priority}</span>
                                ${task.due_date ? `<span>Due: ${task.due_date}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
                    <div class="task-actions">
                        <button class="complete-btn" onclick="toggleComplete('${task._id}')">
                            ${task.completed ? 'Uncomplete' : 'Complete'}
                        </button>
                        <button class="edit-btn" onclick="editTask('${task._id}')">Edit</button>
                        <button class="delete-btn" onclick="deleteTaskConfirm('${task._id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Handle task form submission
        const taskForm = document.getElementById('task-form');
        const addTaskBtn = document.getElementById('add-task-btn');
        
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            hideSuccess();
            
            const taskData = {
                title: document.getElementById('title').value,
                subject: document.getElementById('subject').value,
                description: document.getElementById('description').value,
                due_date: document.getElementById('due-date').value || null,
                priority: document.getElementById('priority').value
            };
            
            addTaskBtn.disabled = true;
            addTaskBtn.textContent = editingTaskId ? 'Updating...' : 'Adding...';
            
            try {
                if (editingTaskId) {
                    await updateTask(editingTaskId, taskData);
                    showSuccess('Task updated successfully!');
                    editingTaskId = null;
                    addTaskBtn.textContent = 'Add Task';
                } else {
                    await createTask(taskData);
                    showSuccess('Task added successfully!');
                }
                
                taskForm.reset();
                await loadTasks();
                
                setTimeout(() => hideSuccess(), 3000);
            } catch (error) {
                showError(error.message);
            } finally {
                addTaskBtn.disabled = false;
                if (!editingTaskId) {
                    addTaskBtn.textContent = 'Add Task';
                }
            }
        });
        
        // Toggle task completion
        async function toggleComplete(taskId) {
            try {
                await toggleTaskComplete(taskId);
                await loadTasks();
            } catch (error) {
                showError('Failed to update task: ' + error.message);
            }
        }
        
        // Edit task
        async function editTask(taskId) {
            try {
                const data = await getTask(taskId);
                const task = data.task;
                
                document.getElementById('title').value = task.title;
                document.getElementById('subject').value = task.subject;
                document.getElementById('description').value = task.description || '';
                document.getElementById('due-date').value = task.due_date || '';
                document.getElementById('priority').value = task.priority;
                
                editingTaskId = taskId;
                addTaskBtn.textContent = 'Update Task';
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                showError('Failed to load task: ' + error.message);
            }
        }
        
        // Delete task with confirmation
        async function deleteTaskConfirm(taskId) {
            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }
            
            try {
                await deleteTask(taskId);
                showSuccess('Task deleted successfully!');
                await loadTasks();
                setTimeout(() => hideSuccess(), 3000);
            } catch (error) {
                showError('Failed to delete task: ' + error.message);
            }
        }
        
        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await logout();
                window.location.href = 'login.html';
            } catch (error) {
                showError('Logout failed: ' + error.message);
            }
        });
        
        // Initialize
        checkAuth();
    </script>
</body>
</html>
