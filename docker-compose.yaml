services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    networks:
      - studytask-net
    restart: unless-stopped

  flask1:
    build: .
    env_file:
      - .env
    environment:
      - SERVER_NAME=flask1
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - studytask-net
    restart: unless-stopped

  flask2:
    build: .
    env_file:
      - .env
    environment:
      - SERVER_NAME=flask2
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - studytask-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask1
      - flask2
    networks:
      - studytask-net
    restart: unless-stopped

networks:
  studytask-net:

volumes:
  mongodb_data: